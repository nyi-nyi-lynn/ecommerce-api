services:
  - type: web
    name: ecommerce-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /api/health/db
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: CORS_ORIGIN
        sync: false
      - key: SWAGGER_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ecommerce-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_TTL
        value: 15m
      - key: JWT_REFRESH_TOKEN_TTL_SECONDS
        value: "604800"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RATE_LIMIT_FAIL_OPEN
        value: "true"
      - key: RATE_LIMIT_BLOCK_DURATION_SECONDS
        value: "180"
      - key: RATE_LIMIT_COOKIE_SECURE
        value: "true"

  - type: keyvalue
    name: ecommerce-redis
    plan: free
    ipAllowList: []

databases:
  - name: ecommerce-db
    plan: free
    databaseName: ecommerce_db
    user: ecommerce_user
